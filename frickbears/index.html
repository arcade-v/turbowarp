<div id="content"></div>

<script>
  async function loadHTMLParts() {
    const container = document.getElementById('content');

    const baseURL = 'https://cdn.jsdelivr.net/gh/arcade-v/turbowarp/frickbears/';

    const parts = [
      "Five Nights at Frickbear's!.html.part1",
      "Five Nights at Frickbear's!.html.part2",
      "Five Nights at Frickbear's!.html.part3",
      "Five Nights at Frickbear's!.html.part4",
      "Five Nights at Frickbear's!.html.part5",
      "Five Nights at Frickbear's!.html.part6",
      "Five Nights at Frickbear's!.html.part7"
    ];

    try {
      let combinedHTML = '';

      for (const part of parts) {
        const url = baseURL + encodeURIComponent(part);
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `Failed to load ${part}: HTTP ${response.status}`
          );
        }

        combinedHTML += await response.text();
      }

      container.innerHTML = combinedHTML;
    } catch (error) {
      console.error('Error loading HTML parts:', error);
      container.textContent = 'Failed to load the HTML file.';
    }
  }

  loadHTMLParts();
</script>
