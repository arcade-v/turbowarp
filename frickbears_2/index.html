<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>turbowarp's</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="content">Loading game...</div>

  <script>
    async function loadHTMLParts() {
      const container = document.getElementById('content');

      const baseURL =
        'https://cdn.jsdelivr.net/gh/arcade-v/turbowarp/frickbears_2/';

      const filename = "Five Nights at Frickbear's 2.html";

      const parts = Array.from(
        { length: 20 },
        (_, i) => `${filename}.part${String(i + 1).padStart(2, '0')}`
      );
      try {
        let combinedHTML = '';

        for (const part of parts) {
          const url = baseURL + encodeURIComponent(part);

          console.log('Fetching:', url);

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(
              `Failed to load ${part}: HTTP ${response.status}`
            );
          }

          combinedHTML += await response.text();
        }

        const blob = new Blob(
          [combinedHTML],
          { type: 'text/html' }
        );

        const blobURL = URL.createObjectURL(blob);

        const iframe = document.createElement('iframe');
        iframe.id = 'game';
        iframe.src = blobURL;

        container.replaceWith(iframe);

        iframe.addEventListener('load', () => {
          console.log('Game document loaded.');
        });

      } catch (error) {
        console.error('Error loading game:', error);
        container.textContent = 'Failed to load game: ' + error.message;
      }
    }

    loadHTMLParts();
  </script>
</body>
</html>
