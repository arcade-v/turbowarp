<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>turbowarp</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="content">Loading game...</div>

  <script>
    async function loadHTMLParts() {
      const container = document.getElementById('content');

      const baseURL =
        'https://cdn.jsdelivr.net/gh/arcade-v/turbowarp/frickbears/';

      const parts = Array.from(
        { length: 7 },
        (_, i) => `frickbears.html.part${i + 1}`
      );

      try {
        let combinedHTML = '';

        for (const part of parts) {
          const url = baseURL + encodeURIComponent(part);

          console.log('Fetching:', url);

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(
              `Failed to load ${part}: HTTP ${response.status}`
            );
          }

          combinedHTML += await response.text();
        }

        const blob = new Blob(
          [combinedHTML],
          { type: 'text/html' }
        );

        const blobURL = URL.createObjectURL(blob);

        const iframe = document.createElement('iframe');
        iframe.id = 'game';
        iframe.src = blobURL;

        // Replace the loading message with the game.
        container.replaceWith(iframe);

        // Release the Blob URL when the iframe is removed.
        iframe.addEventListener('load', () => {
          console.log('Game document loaded.');
        });

      } catch (error) {
        console.error('Error loading game:', error);
        container.textContent = 'Failed to load game: ' + error.message;
      }
    }

    loadHTMLParts();
  </script>
</body>
</html>
